name: Check package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install . pytest==8.4.2 build
      - run: python -m pytest -q
      - run: python -m build
      - run: goldblum --workspace smoke-workspace demo
      - run: goldblum --workspace smoke-workspace export --format csv --output smoke.csv
