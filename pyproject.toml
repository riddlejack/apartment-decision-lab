[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "goldblum"
version = "0.4.0"
description = "Goldblum: find apartments and compare roommate commutes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jack Riddle"}]
dependencies = ["tzdata>=2025.1; sys_platform == 'win32'"]

[project.optional-dependencies]
collect = ["homeharvest==0.8.18"]

[project.scripts]
goldblum = "housing.cli:main"
housing = "housing.cli:main"

[project.urls]
Repository = "https://github.com/riddlejack/goldblum"

[tool.hatch.build.targets.wheel]
packages = ["housing"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
